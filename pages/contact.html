<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт - Контакты</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/footer.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">Мой Сайт</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="../index.html">Главная</a></li>
                    <li><a href="about.html">О нас</a></li>
                    <li><a href="gallery.html">Галерея</a></li>
                    <li><a href="contact.html" class="active">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <h2>Свяжитесь с нами</h2>
            <p>Если у вас остались вопросы по работе с Git, заполните форму ниже.</p>
        </section>
        <section class="contact-section">
            <form id="contactForm" class="feedback-form">
                <div class="form-group">
                    <label for="name">Ваше имя:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Ваш Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Сообщение:</label>
                    <textarea id="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Отправить</button>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Мой Сайт. Все права защищены.</p>
        </div>
    </footer>
    <script src="../scripts/main.js"></script>
</body>
</html>
